function haversineM(lat1,lon1,lat2,lon2){

  return 2*r*Math.asin(Math.sqrt(a));
}

function strokesOnHole(total, si){
  const t=Math.max(0,Math.round(Number(total)||0));
  const full=Math.floor(t/18), rem=t%18;
  return full + (rem>0 && si<=rem ? 1:0);
}

  const si=rec.receiverId?roundPlayerHole(r,rec.receiverId,holeNo).si:r.course.holes[holeNo-1].si;
  const n=strokesOnHole(rec.strokes,si);
  return {a:rec.receiverId===aId?n:0,b:rec.receiverId===bId?n:0,total:rec.strokes,receiverId:rec.receiverId};
}

function scoreMultiplier(adjustedScore,grossScore,par,cfg){

  // Handicap strokes are applied first, so Birdie/Eagle status uses the adjusted score.
  // Hole-in-One is always an actual gross score of 1, not a net 1 created by a stroke.
  if(grossScore===1) return 8;
  if(adjustedScore<=par-2) return 4;
  if(adjustedScore===par-1) return 2;
  return 1;

function pairResult(r,hole,aId,bId){

  const si=pairStrokeInfo(r,aId,bId,hole.hole);

  if(aAdj===bAdj){ return {aId,bId,square:true,aGross:aScore,bGross:bScore,aStroke:si.a,bStroke:si.b,aAdj,bAdj,points:0}; }

  const par=roundPlayerHole(r,winnerId,hole.hole).par ?? r.course.holes[hole.hole-1].par;
  const sm=scoreMultiplier(basis,winGross,par,r.baccarat);

}

  const out=[]; for(let i=0;i<r.players.length;i++) for(let j=i+1;j<r.players.length;j++){
    const x=pairResult(r,hole,r.players[i].id,r.players[j].id); if(x) out.push(x);
  } return out;
}

function baccaratLedger(r){
  const ledger=Object.fromEntries(r.players.map(p=>[p.id,0]));
  if(!r.games.baccarat) return ledger;
  r.holes.forEach(h=>{
    if(!h.locked || !allScoresEntered(r,h)) return;
    holePairResults(r,h).forEach(x=>{ if(!x.square){ ledger[x.winnerId]+=x.points; ledger[x.loserId]-=x.points; }});
  });
  return ledger;
}

function pairMatchStatus(r,aId,bId){
  let a=0,b=0,played=0;
  r.holes.forEach(h=>{
    if(!h.locked || !allScoresEntered(r,h)) return;
    const x=pairResult(r,h,aId,bId); if(!x) return; played++;
    if(!x.square){ if(x.winnerId===aId)a++; else b++; }

  return {aWins:a,bWins:b,played,margin:a-b};

function basePlayerId(r){ return [...r.players].sort((a,b)=>a.handicap-b.handicap)[0]?.id; }

  const s=Number(h.scores[pid]); if(!Number.isFinite(s)||s<=0)return null;
  const base=basePlayerId(r); if(pid===base)return s;
  const x=pairStrokeInfo(r,pid,base,h.hole); return s-x.a;
}
function skinsState(r){
  const wins=Object.fromEntries(r.players.map(p=>[p.id,0])); let carry=0;
  if(!r.games.skins)return {wins,carry};
  for(const h of r.holes){
    if(!h.locked||!allScoresEntered(r,h))continue;
    const ns=r.players.map(p=>({id:p.id,n:netVsBase(r,h,p.id)}));
    const low=Math.min(...ns.map(x=>x.n)); const best=ns.filter(x=>x.n===low);
    if(best.length===1){ wins[best[0].id]+=r.skins.baseSkin+carry; carry=0; }

  return {wins,carry};

  r.holes.forEach(h=>{ if(!h.locked)return; r.players.forEach(p=>{if(Number(h.putts[p.id])>=3){snake=p.id;holeNo=h.hole;}}); });
  return {snake,holeNo};

function teamState(r){
  let a=0,b=0,played=0;
  if(!r.games.team)return {a,b,played};
  r.holes.forEach(h=>{
    if(!h.locked||!allScoresEntered(r,h))return;
    const ta=r.players.filter(p=>r.teamAssignments[p.id]==='A').map(p=>netVsBase(r,h,p.id)).filter(Number.isFinite);
    const tb=r.players.filter(p=>r.teamAssignments[p.id]==='B').map(p=>netVsBase(r,h,p.id)).filter(Number.isFinite);
    if(!ta.length||!tb.length)return; played++;
    const na=Math.min(...ta), nb=Math.min(...tb); if(na<nb)a++; else if(nb<na)b++;
  });
  return {a,b,played};
}
function allScoresEntered(r,h){ return r.players.every(p=>Number(h.scores[p.id])>0); }

function computeKakiAdjustments(r){
  const list=[];
  for(let i=0;i<r.players.length;i++) for(let j=i+1;j<r.players.length;j++){
    const a=r.players[i],b=r.players[j], rec=r.pairStrokes[pairKey(a.id,b.id)]; if(!rec) continue;
    const high=roundPlayer(r,rec.receiverId); const low=roundPlayer(r,rec.receiverId===a.id?b.id:a.id);
    const st=pairMatchStatus(r,low.id,high.id); // positive => low won more holes
    let next=rec.strokes, reason='No change';
    const threshold=Math.max(1,Number(r.kakiRule?.threshold)||2);
    const maxDrift=Math.max(0,Number(r.kakiRule?.maxDrift)??3);
    const minAllowed=Math.max(0,rec.calculated-maxDrift), maxAllowed=rec.calculated+maxDrift;
    if(st.margin>=threshold){ next=Math.min(maxAllowed,rec.strokes+1); reason=next===rec.strokes?`At Kaki cap (${maxAllowed})`:`${high.name} lost by ${st.margin} holes → +1 next game`; }
    else if(st.margin<=-threshold){ next=Math.max(minAllowed,rec.strokes-1); reason=next===rec.strokes?`At Kaki floor (${minAllowed})`:`${high.name} won by ${Math.abs(st.margin)} holes → -1 next game`; }
    list.push({key:pairKey(a.id,b.id),lowId:low.id,receiverId:high.id,current:rec.strokes,next,reason,margin:st.margin,calculated:rec.calculated});
  }
  return list;
}

function saveExitRound(){
  if(!db.activeRound){view='home';render();return;}
  saveDB(); gpsHoleState=null; view='home'; render(); toast('Round saved. Continue anytime.');
}

function cancelActiveRound(){
  const r=db.activeRound; if(!r)return;
  const played=r.holes.filter(h=>h.locked&&allScoresEntered(r,h)).length;
  const detail=played?` ${played} completed hole${played===1?'':'s'} will be discarded.`:'';
  const ok=window.confirm(`Cancel this round at ${r.course.name}?${detail} Kaki strokes and game history will NOT be updated.`);
  if(!ok)return;
  db.activeRound=null; saveDB(); gpsHoleState=null; view='home'; render(); toast('Round cancelled.');
}

function finishRound(){
  const r=db.activeRound; if(!r)return;
  const played=r.holes.filter(h=>h.locked&&allScoresEntered(r,h)).length;
  if(played===0){ toast('Enter at least one completed hole first.'); return; }
  const adjustments=computeKakiAdjustments(r);
  if(r.autoUpdateKaki){
    adjustments.forEach(a=>{
      db.pairStrokes[a.key]={strokes:a.next,receiverId:a.receiverId,updatedAt:todayISO(),lastRoundId:r.id};
    });
  }
  r.status='completed'; r.completedAt=todayISO(); r.kakiAdjustments=adjustments;
  r.finalLedger=baccaratLedger(r); r.finalSkins=skinsState(r); r.finalSnake=snakeState(r); r.finalTeam=teamState(r);
  db.history.unshift(clone(r)); db.activeRound=null; saveDB();
  historyOpenId=r.id; view='summary'; render();
}

async function initializeCloudState(){
  if(!sb||!authSession?.user?.id)return;
  const {data,error}=await sb.from('user_state').select('payload,updated_at').eq('user_id',authSession.user.id).maybeSingle();
  if(error){cloudMode='error';cloudMessage=error.message;return;}
  if(!data){cloudMode='active';cloudRemoteState=null;await pushCloudState(false);return;}
  const marker=cloudLinkedToCurrentUser();
  if(marker){
    const remoteTime=new Date(data.updated_at||0).getTime(),localTime=new Date(db._updatedAt||0).getTime();
    if(remoteTime>localTime+1500)restoreCloudPayload(data.payload);else await pushCloudState(false);
    cloudMode='active';cloudRemoteState=null;markCloudLinked();return;
  }
  if(!hasMeaningfulLocalData()){
    restoreCloudPayload(data.payload);cloudMode='active';cloudRemoteState=null;markCloudLinked();return;
  }
  cloudMode='pending';cloudRemoteState=data;cloudMessage='Cloud data already exists. Choose which copy to keep.';
}

  await loadSignedInProfile();
  await initializeCloudState();

}

  ${authSession?`<section class="card account-card" style="margin-top:12px"><div class="row between"><div><b>👤 ${esc(authProfile?.full_name||authSession.user.email||'Signed in')}</b><div class="smalltxt muted">@${esc(authProfile?.roundkaki_id||'profile')} · ${cloudMode==='active'?'Cloud sync on':'Cloud setup'}</div></div><button class="btn small outline" data-action="account">Account</button></div></section>`:`<section class="card" style="margin-top:12px"><div class="row between"><div><b>☁️ Save your golf history</b><div class="smalltxt muted">Create a free RoundKaki account</div></div><button class="btn small" data-action="account">Sign in</button></div></section>`}
  <div class="section-title"><h3>Quick access</h3><span>Release v3.0</span></div>
  <div class="quick-grid">
    <button class="quick" data-action="new-game"><div class="qicon">⛳</div><b>Create Game</b><span>Set up a round</span></button>
    <button class="quick" data-action="players"><div class="qicon">👥</div><b>Players</b><span>HCP & Kaki strokes</span></button>
    <button class="quick" data-action="history"><div class="qicon">🏆</div><b>History</b><span>Past rounds</span></button>
    <button class="quick" data-action="account"><div class="qicon">👤</div><b>Account</b><span>ID · profile · cloud</span></button>
  </div>
  <div style="margin-top:10px"><button class="btn outline wide" data-action="settings">⚙️ Data backup & rules</button></div>
  <div class="section-title"><h3>How RoundKaki remembers</h3></div>
  <section class="card"><div class="notice greenish"><b>Kaki Handicap</b><br>Every pair keeps its own stroke history. If the receiver loses the round by 2+ holes, RoundKaki can add +1 for their next meeting. If they win by 2+, it can reduce by 1.</div></section>
  <div class="footer-note">Points/units tracking only. Optional private value reference does not process payments.<br><a href="privacy.html" style="color:inherit">Privacy</a> · <a href="terms.html" style="color:inherit">Terms</a></div></main>`;
}

function wizardView(){
  if(!draft){draft=newDraft();initPairStrokes(draft)}
  const pct=(wizardStep/5)*100;
  return `<main class="shell">${header(true,'Create Game')}<div class="wizard-head"><button class="back" data-action="wizard-back">← Back</button><div class="smalltxt muted">Step ${wizardStep} of 5</div><div class="progressbar"><i style="width:${pct}%"></i></div>${wizardStepContent()}</div></main>`;
}

function wizardStepContent(){
  if(wizardStep===1) return stepCourse();
  if(wizardStep===2) return stepPlayers();
  if(wizardStep===3) return stepStrokes();
  if(wizardStep===4) return stepGames();
  return stepReview();
}

function stepCourse(){
  const saved=db.courseCache||[];
  const geo=courseSearchState;
  const pars=draft.course.holes.map(h=>Number(h.par));
  const sis=draft.course.holes.map(h=>Number(h.si)).sort((a,b)=>a-b);
  const courseReady=pars.length===18&&pars.every(v=>Number.isFinite(v)&&v>=3&&v<=6)&&sis.length===18&&sis.every((v,i)=>v===i+1);
  const parTotal=courseReady?pars.reduce((a,b)=>a+b,0):null;
  let geoHTML='';
  if(['locating','loading','loading-holes','loading-scorecard'].includes(geo.status)) geoHTML=`<div class="geo-card"><b>📍 ${esc(geo.message)}</b><div class="tiny muted" style="margin-top:4px">Keep RoundKaki open while the lookup completes.</div></div>`;
  else if(geo.status==='error') geoHTML=`<div class="notice" style="margin-top:9px"><b>Course lookup unavailable</b><br>${esc(geo.message)} You can still search or enter the course name.</div>`;
  else if(geo.status==='results') geoHTML=`<div class="geo-card"><b>Courses near you</b>${geo.results.map((c,i)=>`<button class="course-result" data-near-course="${i}"><div class="pin">⛳</div><div class="meta"><b>${esc(c.name)}</b><span>${c.distanceKm.toFixed(1)} km away</span></div><span>›</span></button>`).join('')}</div>`;
  else if(geo.status==='selected') geoHTML=`<div class="notice greenish" style="margin-top:9px"><b>✓ Course selected</b><br>${esc(geo.message)}</div>`;
  return `<h2>Where are you playing?</h2><p>Choose your course. RoundKaki will load its scorecard automatically.</p>
  <button class="btn lime wide" data-action="find-course-near-me">📍 Find Course Near Me</button>${geoHTML}
  ${saved.length?`<section class="card" style="margin-top:10px"><div class="row between"><b class="smalltxt">Recent courses</b><span class="tiny muted">saved on this device</span></div>${saved.slice(0,5).map((c,i)=>`<button class="course-result" data-saved-course="${i}"><div class="pin">⛳</div><div class="meta"><b>${esc(c.name)}</b><span>${c.holes?.length===18?'18-hole scorecard':'Saved course'}</span></div><span>›</span></button>`).join('')}</section>`:''}
  <section class="card" style="margin-top:14px"><label class="field"><span>Course name</span><input class="input" id="courseName" list="malaysiaCourseList" autocomplete="off" placeholder="Search Malaysia courses…" value="${esc(draft.course.name)}"><datalist id="malaysiaCourseList">${MALAYSIA_COURSES.map(n=>`<option value="${esc(n)}"></option>`).join('')}</datalist></label>
  ${courseReady?`<div class="notice greenish" style="margin-top:4px"><div class="row between"><div><b>✓ Course data ready</b><br><span class="smalltxt">18 holes · Par ${parTotal} · Stroke Index verified</span></div><button class="btn small outline" data-action="toggle-course-holes">Review</button></div></div>`:`<div class="notice" style="margin-top:4px"><b>⚠️ Course data incomplete</b><br><span class="smalltxt">RoundKaki needs the Par and real Stroke Index for all 18 holes before play.</span><div class="row" style="gap:8px;margin-top:9px"><button class="btn small soft" data-action="refresh-web-scorecard">Try Course Lookup</button><button class="btn small outline" data-action="toggle-course-holes">Review / Enter Scorecard</button></div></div>`}
  <div id="courseHoles" class="course-holes hidden" style="margin-top:10px">${draft.course.holes.map(h=>`<div class="hole-mini"><b>H${h.hole}</b><div class="labels"><span>Par</span><span>SI</span><span>m</span></div><div class="mini-fields"><input data-hole-par="${h.hole}" type="number" min="3" max="6" value="${h.par??''}" placeholder="—" title="Par"><input data-hole-si="${h.hole}" type="number" min="1" max="18" value="${h.si??''}" placeholder="—" title="Stroke Index"><input data-hole-dist="${h.hole}" type="number" min="0" max="800" value="${h.distance??''}" placeholder="—" title="Distance metres"></div></div>`).join('')}</div>
  </section>
  <button class="btn wide" style="margin-top:10px" data-action="wizard-next">Choose Players →</button>`;
}
function stepPlayers(){
  const emptyHint = db.players.length===0 ? `<div class="empty" style="margin-bottom:10px"><b>No golfers saved yet.</b><br>Create your own golfer profiles to start this flight.</div>` : '';
  draft.playerTees=draft.playerTees||{};
  draft.playerIds.forEach(id=>{ if(!draft.playerTees[id]) draft.playerTees[id]=preferredTeeForPlayer(player(id)); });
  return `<h2>Who is in the flight?</h2><p>Add 2–6 golfers. Each golfer can play from a different tee box; RoundKaki remembers their preferred tee.</p>
  <section class="card" style="margin-top:14px">${emptyHint}<div class="player-cols"><span>Golfer</span><span>HCP</span><span>Tee</span><span></span></div><div id="draftPlayers">${draft.playerIds.map((id,i)=>{const p=player(id);const tee=draft.playerTees[id]||preferredTeeForPlayer(p);return `<div class="player-line"><select class="select" data-draft-player="${i}">${db.players.map(x=>`<option value="${x.id}" ${x.id===id?'selected':''}>${esc(x.name)}</option>`).join('')}</select><input class="input" data-edit-hcp="${id}" type="number" step="0.1" value="${p?.handicap??18}" title="Handicap"><select class="select" data-player-tee="${id}" title="Player tee">${STANDARD_TEES.map(t=>`<option value="${t}" ${normalizeTeeColor(tee)===t?'selected':''}>${teeEmoji(t)} ${t}</option>`).join('')}</select><button class="xbtn" data-remove-draft="${i}">×</button></div>`}).join('')}</div><button class="btn outline wide" data-action="add-draft-player">+ Add Player</button><div class="divider"></div><button class="btn soft wide" data-action="quick-new-player">Create New Golfer</button></section>
  <div class="notice greenish"><b>Individual tee boxes</b><br>Red, White, Blue and Black are set per golfer. RoundKaki uses that golfer’s tee-specific Par / SI / distance when the selected course data provides it. If tee-specific data is unavailable, the verified course scorecard is used as fallback.</div>
  <button class="btn wide" style="margin-top:10px" data-action="wizard-next">Set Kaki Strokes →</button>`;
}

function stepStrokes(){
  const vals=[50,70,80,100];
  return `<h2>Set stroke relationships</h2><p>RoundKaki calculates a starting point from handicap difference, then remembers the actual strokes your group uses.</p>
  <section class="card" style="margin-top:14px"><div class="smalltxt strong" style="margin-bottom:7px">Allowance</div><div class="pills">${vals.map(v=>`<button class="pill ${draft.allowance===v?'active':''}" data-allowance="${v}">${v}%</button>`).join('')}<button class="pill ${!vals.includes(draft.allowance)?'active':''}" data-allowance="custom">Custom</button></div>${!vals.includes(draft.allowance)?`<input class="input" id="customAllowance" type="number" min="0" max="200" value="${draft.allowance}" style="margin-top:9px">`:''}<div class="divider"></div><label class="row between"><span class="smalltxt"><b>Use saved Kaki strokes</b><br><span class="muted">Load previous pair history when available</span></span><input id="useHistory" type="checkbox" ${draft.useKakiHistory?'checked':''}></label></section>
  <section class="card"><div class="stroke-matrix"><table class="stroke-table"><thead><tr><th>Pair</th><th>Calc</th><th>Saved</th><th>Use now</th></tr></thead><tbody>${Object.values(draft.pairStrokes).map(s=>{const a=player(s.lowId),b=player(s.receiverId);return `<tr><td><b>${esc(a?.name)} → ${esc(b?.name)}</b><div class="tiny muted">${esc(b?.name)} receives</div></td><td>${s.calculated}</td><td>${s.saved==null?'—':s.saved}</td><td><input class="stroke-num" data-pair-stroke="${pairKey(s.aId,s.bId)}" type="number" min="0" max="36" value="${s.strokes}"></td></tr>`}).join('')}</tbody></table></div></section>
  <label class="card row between"><span class="smalltxt"><b>Auto-update next-game strokes</b><br><span class="muted">Default: lose by 2+ holes = +1 next game; win by 2+ = −1. Capped ±3 from calculated.</span></span><input id="autoUpdate" type="checkbox" ${draft.autoUpdateKaki?'checked':''}></label>
  <button class="btn wide" data-action="wizard-next">Choose Games →</button>`;
}

function gameOption(key,ico,title,desc){return `<button class="game-option ${draft.games[key]?'selected':''}" data-game="${key}"><div class="ico">${ico}</div><div class="meta"><b>${title}</b><span>${desc}</span></div><div class="check">${draft.games[key]?'✓':''}</div></button>`}
function stepGames(){
  const teamOn=draft.games.team;
  return `<h2>What are you playing?</h2><p>Run several games at once. Enter each golfer’s score once; RoundKaki updates everything.</p>
  <section class="card" style="margin-top:14px">${gameOption('baccarat','🃏','Baccarat','Pair-by-pair points, UP/SINGLE and strokes')}${gameOption('match','🏆','Individual Match','Every player pair tracked hole-by-hole')}${gameOption('skins','🔥','Skins','Unique low net takes the skin; ties can carry')}${gameOption('snake','🐍','Snake','Last player to 3-putt holds the snake')}${gameOption('team','🤝','Partners / Best Ball','Team A vs Team B using best net score')}</section>
  ${draft.games.baccarat?`<section class="card"><b>Baccarat Golf settings</b><div class="row" style="margin-top:10px"><label class="field" style="flex:1"><span>Base points</span><input class="input" id="basePoints" type="number" min="1" value="${draft.baccarat.basePoints}"></label></div><label class="field"><span>Score multiplier basis</span><select class="select" id="multBasis"><option value="adjusted" ${draft.baccarat.multiplierBasis==='adjusted'?'selected':''}>After handicap strokes (recommended)</option><option value="gross" ${draft.baccarat.multiplierBasis==='gross'?'selected':''}>Gross score only</option></select></label><div class="notice greenish"><b>Baccarat Golf points ladder</b><br>Pair result is decided after strokes. Square = PUSH / 0. Single vs Single Par win = 1 pt; each UP adds ×2. Winner Birdie ×2 · Eagle ×4 · actual Hole-in-One ×8. Therefore UP vs UP: Par win 4 · Birdie 8 · Eagle 16 · HIO 32.</div><div class="tiny muted" style="margin-top:8px">RoundKaki tracks golf points only. It does not accept stakes, hold funds, arrange wagers, or process payouts.</div></section>`:''}
  ${teamOn?`<section class="card"><b>Partner teams</b><div style="margin-top:9px">${draft.playerIds.map((id,i)=>{const p=player(id);const team=draft.teamAssignments[id]|| (i<Math.ceil(draft.playerIds.length/2)?'A':'B');draft.teamAssignments[id]=team;return `<div class="row between" style="margin-bottom:7px"><span class="smalltxt strong">${esc(p?.name)}</span><select class="select" data-team="${id}" style="width:120px"><option value="A" ${team==='A'?'selected':''}>Team A</option><option value="B" ${team==='B'?'selected':''}>Team B</option></select></div>`}).join('')}</div></section>`:''}
  <button class="btn wide" data-action="wizard-next">Review Game →</button>`;
}

function stepReview(){
  return `<h2>Ready to tee off?</h2><p>Review the round. You can still go back and change anything.</p>
  <section class="card" style="margin-top:14px"><div class="eyebrow green">Course</div><h3 style="margin:4px 0">${esc(draft.course.name)}</h3><div class="smalltxt muted">18 holes · individual player tees</div><div class="divider"></div><div class="eyebrow green">Players</div><div class="row wrap" style="margin-top:8px">${draft.playerIds.map(id=>{const p=player(id);return `<span class="pill active">${esc(p?.name)} · HCP ${p?.handicap} · ${esc(draft.playerTees?.[id]||preferredTeeForPlayer(p))}</span>`}).join('')}</div><div class="divider"></div><div class="eyebrow green">Games</div><div class="row wrap" style="margin-top:8px">${Object.entries(draft.games).filter(x=>x[1]).map(([k])=>`<span class="pill">${({baccarat:'🃏 Baccarat',match:'🏆 Match',skins:'🔥 Skins',snake:'🐍 Snake',team:'🤝 Partners'})[k]}</span>`).join('')}</div></section>
  <section class="card"><b>Stroke memory</b><div class="smalltxt muted" style="margin-top:4px">${Object.values(draft.pairStrokes).map(s=>`${esc(player(s.receiverId)?.name)} gets ${s.strokes} from ${esc(player(s.lowId)?.name)}`).join(' · ')}</div></section>
  <div class="notice greenish"><b>Before every hole</b><br>Each player declares SINGLE or UP. Lock declarations before teeing off. The exact declaration is time-stamped and saved with that hole.</div>
  <button class="btn lime wide" style="margin-top:12px" data-action="start-round">START ROUND ⛳</button>`;
}

function roundView(){
  const r=db.activeRound; if(!r){view='home';return homeView();}
  const h=r.holes[r.currentHole-1], ch=r.course.holes[r.currentHole-1];
  const pairs=(h.locked&&allScoresEntered(r,h))?holePairResults(r,h):[];
  const ledger=baccaratLedger(r), skins=skinsState(r), snake=snakeState(r), team=teamState(r);
  return `<main class="shell">${header(true,r.course.name)}
  <div class="round-top"><div class="hole-header"><div><div class="eyebrow">INDIVIDUAL TEES · ${esc(r.course.name)}</div><h2>Hole ${h.hole}</h2></div><div class="navhole"><button data-hole-nav="-1">‹</button><button data-hole-nav="1">›</button></div></div>${r.course.holes.some(x=>Number.isFinite(x.centerLat))?`<div class="gps-helper"><div><b>📍 GPS Hole Helper</b><br><span>${gpsHoleState?.message?esc(gpsHoleState.message):'Suggest nearest mapped hole and approximate pin distance.'}</span></div><button class="btn small outline" data-action="gps-hole">Locate</button></div>`:''}</div>
  <div class="row between" style="margin:8px 0 2px"><button class="btn small outline" data-action="round-summary">Round Overview</button><button class="btn small danger" data-action="cancel-round">Cancel Round</button></div>
  ${r.games.baccarat?`<div class="section-title"><h3>1 · Declare UP</h3><span>${h.locked?'Locked ✓':'Before tee-off'}</span></div><section class="card"><div class="declare-grid">${r.players.map(p=>`<div class="declare ${h.locked?'locked':''}"><div class="name">${esc(p.name)}</div><div class="seg"><button ${h.locked?'disabled':''} class="${!h.up[p.id]?'active single':''}" data-up="${p.id}" data-v="0">SINGLE</button><button ${h.locked?'disabled':''} class="${h.up[p.id]?'active up':''}" data-up="${p.id}" data-v="1">UP ×2</button></div></div>`).join('')}</div><button class="btn ${h.locked?'outline':'lime'} wide" style="margin-top:10px" data-action="${h.locked?'unlock-hole':'lock-hole'}">${h.locked?'Edit / Unlock Hole':'LOCK DECLARATIONS'}</button>${h.locked?'<div class="tiny muted" style="margin-top:7px;text-align:center">UP/SINGLE is saved with this hole.</div>':''}</section>`:`<section class="card"><div class="row between"><div><b>${h.locked?'Hole ready ✓':'Start this hole'}</b><div class="tiny muted">Lock the hole before entering scores.</div></div><button class="btn small ${h.locked?'outline':'lime'}" data-action="${h.locked?'unlock-hole':'lock-hole'}">${h.locked?'Unlock':'START'}</button></div></section>`}
  <section class="card"><div class="row between"><b>Stroke check · SI ${ch.si}</b><span class="tiny muted">pair-by-pair</span></div><div class="smalltxt muted" style="margin-top:7px">${holeStrokeHTML(r,h.hole)}</div></section>
  <div class="section-title"><h3>${r.games.baccarat?'2':'1'} · Enter scores</h3><span>Gross score${r.games.snake?' + putts':''}</span></div>
  <section class="card"><div class="score-list">${r.players.map(p=>{const ph=roundPlayerHole(r,p.id,h.hole),s=h.scores[p.id]||ph.par||ch.par;return `<div class="score-row"><div><b>${esc(p.name)}</b>${h.up[p.id]?'<span class="upbadge">UP ×2</span>':''}<div class="subline"><span class="tee-chip">${esc(p.tee||'White')} tee</span> · HCP ${p.handicap} · Par ${ph.par??'—'} · SI ${ph.si??'—'}${ph.distance?` · ${ph.distance}m`:''}${r.games.snake?`<div class="putts">Putts <input data-putts="${p.id}" type="number" min="0" max="9" value="${h.putts[p.id]??''}" ${!h.locked?'disabled':''}></div>`:''}</div></div><div class="score-step"><button data-score="${p.id}" data-d="-1" ${!h.locked?'disabled':''}>−</button><strong id="score_${p.id}">${s}</strong><button data-score="${p.id}" data-d="1" ${!h.locked?'disabled':''}>+</button></div></div>`}).join('')}</div>${h.locked&&!allScoresEntered(r,h)?'<div class="tiny muted" style="margin-top:8px">Scores default to par when you first tap + or −.</div>':''}</section>
  ${h.locked&&allScoresEntered(r,h)?`<div class="section-title"><h3>Hole result</h3><span>${pairs.filter(x=>x.square).length} square pair${pairs.filter(x=>x.square).length===1?'':'s'}</span></div><section class="card"><div class="tabs"><button class="tab active">Baccarat</button>${r.games.match?'<button class="tab">Match</button>':''}</div><div class="pair-list">${pairs.map(x=>pairHTML(r,x)).join('')}</div></section>`:''}
  ${r.games.baccarat?`<div class="section-title"><h3>Running Baccarat</h3><span>points / units</span></div><section class="card"><div class="ledger">${ledgerHTML(r,ledger)}</div></section>`:''}
  ${r.games.match?`<section class="card"><div class="row between"><b>🏆 Pair Match</b><span class="tiny muted">holes won</span></div><div class="pair-list" style="margin-top:9px">${pairMatchHTML(r)}</div></section>`:''}
  ${r.games.skins?`<section class="card"><div class="row between"><b>🔥 Skins</b><span class="tiny muted">carry ${skins.carry}</span></div><div class="smalltxt" style="margin-top:8px">${r.players.map(p=>`${esc(p.name)} <b>${skins.wins[p.id]}</b>`).join(' · ')}</div></section>`:''}
  ${r.games.snake?`<section class="card"><div class="row between"><b>🐍 Snake</b><span class="smalltxt ${snake.snake?'red':'muted'}">${snake.snake?`${esc(roundPlayer(r,snake.snake)?.name)} · H${snake.holeNo}`:'No 3-putt yet'}</span></div></section>`:''}
  ${r.games.team?`<section class="card"><div class="row between"><b>🤝 Partners</b><span class="smalltxt">Team A ${team.a} · ${team.b} Team B</span></div></section>`:''}
  <div class="bottom-actions"><div class="inner"><button class="btn outline" data-action="save-exit-round">SAVE & EXIT</button><button class="btn" data-action="next-hole">${r.currentHole===18?'FINISH ROUND':'SAVE & NEXT HOLE →'}</button></div></div></main>`;
}

function pairHTML(r,x){
  const a=roundPlayer(r,x.aId),b=roundPlayer(r,x.bId);
  if(x.square)return `<div class="pair square"><div><div class="pairname">${esc(a.name)} ↔ ${esc(b.name)} · SQUARE</div><div class="detail">${x.aGross}${x.aStroke?` −${x.aStroke}`:''} = ${x.aAdj} · ${x.bGross}${x.bStroke?` −${x.bStroke}`:''} = ${x.bAdj}</div></div><div class="pts">0 pts</div></div>`;
  const w=roundPlayer(r,x.winnerId),l=roundPlayer(r,x.loserId);
  const tags=[x.winnerUp?'winner UP':'',x.loserUp?'loser UP':'',x.scoreMultiplier>1?`${baccaratLabel(x.scoreMultiplier)} ×${x.scoreMultiplier}`:''].filter(Boolean).join(' · ');
  return `<div class="pair"><div><div class="pairname">${esc(l.name)} → ${esc(w.name)}</div><div class="detail">${esc(a.name)} ${x.aGross}${x.aStroke?`−${x.aStroke}`:''}=${x.aAdj} · ${esc(b.name)} ${x.bGross}${x.bStroke?`−${x.bStroke}`:''}=${x.bAdj}${tags?` · ${tags}`:''}</div></div><div class="pts">${x.points} pts</div></div>`;
}
function holeStrokeHTML(r,holeNo){
  const lines=[];
  for(let i=0;i<r.players.length;i++) for(let j=i+1;j<r.players.length;j++){
    const a=r.players[i],b=r.players[j],x=pairStrokeInfo(r,a.id,b.id,holeNo);
    if(x.a>0) lines.push(`<b>${esc(a.name)}</b> gets ${x.a} from ${esc(b.name)}`);
    if(x.b>0) lines.push(`<b>${esc(b.name)}</b> gets ${x.b} from ${esc(a.name)}`);
  }
  return lines.length?lines.join(' · '):'No handicap strokes apply between any pair on this hole.';
}

function upHistoryHTML(r){
  const rows=r.holes.filter(h=>h.locked&&allScoresEntered(r,h));
  if(!rows.length)return '<div class="empty">No completed holes.</div>';
  return rows.map(h=>{
    const ups=r.players.filter(p=>h.up[p.id]).map(p=>esc(p.name));
    const singles=r.players.filter(p=>!h.up[p.id]).map(p=>esc(p.name));
    return `<div class="history-item"><div class="history-icon">H${h.hole}</div><div class="main"><b>UP: ${ups.length?ups.join(', '):'None'}</b><span>Single: ${singles.join(', ')}${h.lockedAt?` · locked ${fmtTime(h.lockedAt)}`:''}</span></div></div>`;
  }).join('');
}

function ledgerHTML(r,ledger){
  const vals=Object.values(ledger); const max=Math.max(...vals),min=Math.min(...vals);
  return r.players.map(p=>{const v=ledger[p.id]||0;const ref=moneyRef(r,v);return `<div class="ledger-item ${v===max&&max>0?'lead':''} ${v===min&&min<0?'tail':''}"><div class="n">${esc(p.name)}</div><div class="v ${v>0?'positive':v<0?'negative':''}">${v>0?'+':''}${v}</div><div class="u">points${ref?` · ${esc(ref)}`:''}</div></div>`}).join('');
}
function pairMatchHTML(r){
  let out='';for(let i=0;i<r.players.length;i++)for(let j=i+1;j<r.players.length;j++){
    const a=r.players[i],b=r.players[j],s=pairMatchStatus(r,a.id,b.id); const label=s.margin===0?'AS':s.margin>0?`${a.name} ${s.margin} UP`:`${b.name} ${Math.abs(s.margin)} UP`;
    out+=`<div class="pair"><div class="pairname">${esc(a.name)} vs ${esc(b.name)}</div><div class="pts">${esc(label)}</div></div>`;
  }return out;
}

function roundSummaryOverlay(){
  const r=db.activeRound, ledger=baccaratLedger(r), played=r.holes.filter(h=>h.locked&&allScoresEntered(r,h)).length;
  return `<main class="shell">${header(true,'Round Overview')}<section class="result-hero"><div class="trophy">⛳</div><h2>${esc(r.course.name)}</h2><div class="muted">${played} / 18 holes completed</div></section>${r.games.baccarat?`<section class="card"><b>Baccarat ledger</b><div class="ledger" style="margin-top:10px">${ledgerHTML(r,ledger)}</div></section>`:''}<section class="card"><b>Hole status</b><div class="course-holes" style="margin-top:9px">${r.holes.map(h=>`<button class="hole-mini" data-jump-hole="${h.hole}" style="text-align:left;background:${h.locked?'#eef8f1':'#fff'}"><b>H${h.hole}</b><div class="tiny muted">${h.locked&&allScoresEntered(r,h)?'✓ scored':h.locked?'locked':'open'}</div></button>`).join('')}</div></section><button class="btn wide" data-action="back-to-round">Back to Hole ${r.currentHole}</button><button class="btn outline wide" style="margin-top:8px" data-action="save-exit-round">Save & Exit to Home</button><button class="btn danger wide" style="margin-top:8px" data-action="cancel-round">Cancel & Discard Round</button><button class="btn danger wide" style="margin-top:8px;background:#fff;color:#88333d" data-action="finish-round">Finish Round Now</button></main>`;
}

function playersView(){
  const savedPairs=Object.entries(db.pairStrokes);
  return `<main class="shell">${header(true,'Players')}<section class="card"><div class="row between"><div><b>Golfer profiles</b><div class="tiny muted">Official HCP + recurring Kaki history</div></div><button class="btn small" data-action="quick-new-player">+ Add</button></div><div style="margin-top:10px">${db.players.map(p=>`<div class="history-item"><div class="history-icon">🏌️</div><div class="main"><b>${esc(p.name)}</b><span>Handicap ${p.handicap} · ${teeEmoji(preferredTeeForPlayer(p))} ${esc(preferredTeeForPlayer(p))} tee</span></div><button class="btn small outline" data-edit-player="${p.id}">Edit</button></div>`).join('')}</div></section>
  <div class="section-title"><h3>Remembered Kaki strokes</h3><span>${savedPairs.length} pair${savedPairs.length===1?'':'s'}</span></div><section class="card">${savedPairs.length?savedPairs.map(([k,s])=>{const [a,b]=k.split('|'),pa=player(a),pb=player(b),rec=player(s.receiverId);const giver=s.receiverId===a?pb:pa;return `<div class="history-item"><div class="history-icon">↔</div><div class="main"><b>${esc(giver?.name)} → ${esc(rec?.name)}: ${s.strokes} strokes</b><span>Updated ${s.updatedAt?fmtDate(s.updatedAt):'from game setup'}</span></div></div>`}).join(''):'<div class="empty">No saved pair history yet. Finish a round to start building it.</div>'}</section></main>`;
}

function historyView(){
  return `<main class="shell">${header(true,'Game History')}<section class="card">${db.history.length?db.history.map(r=>`<button class="history-item" style="width:100%;border-left:0;border-right:0;border-top:0;background:transparent;text-align:left" data-history="${r.id}"><div class="history-icon">⛳</div><div class="main"><b>${esc(r.course.name)}</b><span>${fmtDate(r.completedAt||r.createdAt)} · ${r.players.map(p=>esc(p.name)).join(', ')}</span></div><span>›</span></button>`).join(''):'<div class="empty">No completed rounds yet.</div>'}</section></main>`;
}

function summaryView(){
  const r=db.history.find(x=>x.id===historyOpenId) || db.history[0];
  if(!r){view='history';return historyView();}
  const led=r.finalLedger||baccaratLedger(r); const order=[...r.players].sort((a,b)=>(led[b.id]||0)-(led[a.id]||0));
  return `<main class="shell">${header(true,'Round Results')}<section class="result-hero"><div class="trophy">🏆</div><h2>${esc(r.course.name)}</h2><div class="muted">${fmtDate(r.completedAt||r.createdAt)} · ${r.players.map(p=>`${esc(p.name)} ${esc(p.tee||'White')}`).join(' · ')}</div></section>
  ${r.games.baccarat?`<section class="card"><b>🃏 Baccarat final</b><div style="margin-top:8px">${order.map((p,i)=>{const v=led[p.id]||0;return `<div class="rank"><div class="place">${i+1}</div><div class="who">${esc(p.name)}</div><div class="bal ${v>0?'positive':v<0?'negative':''}">${v>0?'+':''}${v} pts${moneyRef(r,v)?`<div class="tiny muted">${esc(moneyRef(r,v))}</div>`:''}</div></div>`}).join('')}</div></section>`:''}
  ${r.kakiAdjustments?.length?`<section class="card"><b>🧠 Next-game Kaki strokes</b><div class="tiny muted" style="margin-top:3px">${r.autoUpdateKaki?'Saved automatically':'Recommendations only'}</div>${r.kakiAdjustments.map(a=>{const low=roundPlayer(r,a.lowId),hi=roundPlayer(r,a.receiverId);return `<div class="adjust"><div><b>${esc(low?.name)} → ${esc(hi?.name)}</b><span>${esc(a.reason)}</span></div><div class="delta">${a.current} → ${a.next}</div></div>`}).join('')}</section>`:''}
  ${r.games.baccarat?`<section class="card"><div class="row between"><b>🔥 UP declaration history</b><span class="tiny muted">audit by hole</span></div><div style="margin-top:8px">${upHistoryHTML(r)}</div></section>`:''}
  <button class="btn wide" data-action="repeat-last">Repeat This Setup</button><button class="btn outline wide" style="margin-top:8px" data-action="new-game">Create Different Game</button><button class="btn outline wide" style="margin-top:8px" data-action="history">Back to History</button></main>`;
}


function settingsView(){
  return `<main class="shell">${header(true,'Data & Rules')}
  <section class="card"><b>RoundKaki game rules</b><div class="notice greenish" style="margin-top:10px"><b>Kaki Stroke memory</b><br>Pair-specific strokes are remembered. At round end, a receiver losing by 2+ holes gets +1 next game; winning by 2+ gets −1. You can override any suggested stroke before the next round.</div><div class="notice" style="margin-top:9px"><b>Baccarat Golf</b><br>Strokes apply before comparing each pair. Square is a push. UP/SINGLE is locked per golfer per hole. UP vs UP gives 4 points for a normal win, 8 for Birdie, 16 for Eagle and 32 for an actual Hole-in-One.</div></section>
  <section class="card"><b>📍 Malaysia Course Pack & GPS</b><p class="smalltxt muted">RoundKaki uses the free, keyless OpenGolfAPI for Par / Stroke Index / tee scorecards and OpenStreetMap for mapped hole layout. No API key is required for normal use. Course data is cached on this device after it is loaded.</p><button class="btn wide" data-action="sync-malaysia-pack" ${malaysiaPackSyncState.running?'disabled':''}>${malaysiaPackSyncState.running?'Syncing Malaysia Course Pack…':'Download / Refresh Malaysia Course Pack'}</button>${malaysiaPackSyncState.message?`<div class="notice greenish" style="margin-top:9px"><b>${esc(malaysiaPackSyncState.message)}</b></div>`:''}<div class="tiny muted" style="margin-top:8px">Cached courses: ${db.courseCache?.length||0}/${MALAYSIA_COURSES.length}. A synced scorecard still needs golfer/club review if its SI is incomplete. GPS location is requested only when you tap a GPS feature.</div><details style="margin-top:10px"><summary class="smalltxt"><b>Optional backup data provider</b></summary><p class="tiny muted">If you already have a GolfCourseAPI key, RoundKaki can use it as a fallback when the open source does not contain a course.</p><label class="field"><span>GolfCourseAPI key (optional)</span><input class="input" id="golfApiKey" type="password" value="${esc(db.settings?.golfCourseApiKey||'')}" placeholder="Optional"></label><button class="btn small outline" data-action="save-api-key">Save optional key</button></details><div class="tiny muted" style="margin-top:10px">Data attribution: scorecard/course data may contain OpenGolfAPI data (ODbL); mapped layout may contain OpenStreetMap data (ODbL).</div></section>
  <section class="card"><b>Local data backup</b><p class="smalltxt muted">Guest data is stored on this device. When signed in, RoundKaki can also sync players, rounds and Kaki-stroke memory to your private cloud account. Manual export remains available as an extra backup.</p><button class="btn wide" data-action="export-data">Export RoundKaki backup</button><button class="btn outline wide" style="margin-top:8px" data-action="import-data">Import backup</button><input id="importFile" type="file" accept="application/json" class="hidden"></section>
  <section class="card"><b>Golf scoring only</b><p class="smalltxt muted">RoundKaki records golf scores and non-cash points/units. It does not accept stakes, hold funds, facilitate wagering, or process payouts.</p></section>
  <button class="btn danger wide" data-action="reset-data">Reset local demo data</button></main>`;
}
function exportDataFile(){
  const payload=JSON.stringify({...db,exportedAt:todayISO(),app:'RoundKaki',schema:5},null,2);
  const blob=new Blob([payload],{type:'application/json'}); const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=`RoundKaki-backup-${new Date().toISOString().slice(0,10)}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),500);toast('Backup exported.');
}
function resetData(){ if(confirm('Reset all RoundKaki local data on this device?')){localStorage.removeItem(DB_KEY);db=defaultDB();view='home';render();} }
function importBackup(file){
  const reader=new FileReader(); reader.onload=()=>{try{const x=JSON.parse(reader.result);if(!x||!Array.isArray(x.players))throw new Error();x.version=6;x.courseCache=Array.isArray(x.courseCache)?x.courseCache:[];db=x;saveDB();view='home';render();toast('Backup imported.');}catch{toast('That backup file is not valid.');}};reader.readAsText(file);
}

function bind(){
  const importFile=document.getElementById('importFile');if(importFile)importFile.onchange=()=>{if(importFile.files?.[0])importBackup(importFile.files[0]);};
  document.querySelectorAll('[data-action]').forEach(el=>el.onclick=()=>action(el.dataset.action,el));
  document.querySelectorAll('[data-hole-nav]').forEach(el=>el.onclick=()=>moveHole(Number(el.dataset.holeNav)));
  document.querySelectorAll('[data-up]').forEach(el=>el.onclick=()=>setUp(el.dataset.up,el.dataset.v==='1'));
  document.querySelectorAll('[data-score]').forEach(el=>el.onclick=()=>changeScore(el.dataset.score,Number(el.dataset.d)));
  document.querySelectorAll('[data-putts]').forEach(el=>el.onchange=()=>{const r=db.activeRound,h=r.holes[r.currentHole-1];h.putts[el.dataset.putts]=el.value===''?null:Number(el.value);saveDB();render();});
  document.querySelectorAll('[data-jump-hole]').forEach(el=>el.onclick=()=>{db.activeRound.currentHole=Number(el.dataset.jumpHole);saveDB();view='round';render();});
  document.querySelectorAll('[data-history]').forEach(el=>el.onclick=()=>{historyOpenId=el.dataset.history;view='summary';render();});
  document.querySelectorAll('[data-game]').forEach(el=>el.onclick=()=>{draft.games[el.dataset.game]=!draft.games[el.dataset.game];render();});
  document.querySelectorAll('[data-allowance]').forEach(el=>el.onclick=()=>{const v=el.dataset.allowance;draft.allowance=v==='custom'?75:Number(v);initPairStrokes(draft);render();});
  document.querySelectorAll('[data-pair-stroke]').forEach(el=>el.onchange=()=>{draft.pairStrokes[el.dataset.pairStroke].strokes=Number(el.value)||0;draft.pairStrokes[el.dataset.pairStroke].source='custom';});
  document.querySelectorAll('[data-draft-player]').forEach(el=>el.onchange=()=>{const idx=Number(el.dataset.draftPlayer),oldId=draft.playerIds[idx];draft.playerIds[idx]=el.value;draft.playerIds=[...new Set(draft.playerIds)];draft.playerTees=draft.playerTees||{};if(oldId!==el.value)draft.playerTees[el.value]=preferredTeeForPlayer(player(el.value));initPairStrokes(draft);render();});
  document.querySelectorAll('[data-edit-hcp]').forEach(el=>el.onchange=()=>{const p=player(el.dataset.editHcp);if(p){p.handicap=Number(el.value)||0;saveDB();initPairStrokes(draft);render();}});
  document.querySelectorAll('[data-player-tee]').forEach(el=>el.onchange=()=>{const id=el.dataset.playerTee;draft.playerTees=draft.playerTees||{};draft.playerTees[id]=normalizeTeeColor(el.value);const p=player(id);if(p){p.preferredTee=normalizeTeeColor(el.value);saveDB();}render();});
  document.querySelectorAll('[data-remove-draft]').forEach(el=>el.onclick=()=>{if(draft.playerIds.length<=2)return toast('Keep at least 2 players.');draft.playerIds.splice(Number(el.dataset.removeDraft),1);initPairStrokes(draft);render();});
  document.querySelectorAll('[data-team]').forEach(el=>el.onchange=()=>{draft.teamAssignments[el.dataset.team]=el.value;});
  document.querySelectorAll('[data-edit-player]').forEach(el=>el.onclick=()=>openPlayerEditor(el.dataset.editPlayer,false));
  document.querySelectorAll('[data-hole-par]').forEach(el=>el.onchange=()=>{draft.course.holes[Number(el.dataset.holePar)-1].par=Number(el.value)});
  document.querySelectorAll('[data-hole-si]').forEach(el=>el.onchange=()=>{draft.course.holes[Number(el.dataset.holeSi)-1].si=Number(el.value)});
  document.querySelectorAll('[data-hole-dist]').forEach(el=>el.onchange=()=>{draft.course.holes[Number(el.dataset.holeDist)-1].distance=el.value===''?null:Number(el.value)});
  document.querySelectorAll('[data-near-course]').forEach(el=>el.onclick=()=>{const row=courseSearchState.results[Number(el.dataset.nearCourse)];if(row)loadOSMCourse(row);});
  document.querySelectorAll('[data-saved-course]').forEach(el=>el.onclick=()=>{const c=db.courseCache[Number(el.dataset.savedCourse)];if(c){draft.course=clone(c);courseSearchState={status:'selected',results:[],message:`Loaded saved details for ${c.name}.`};render();}});
  const cn=document.getElementById('courseName');if(cn){cn.oninput=()=>draft.course.name=cn.value;cn.onchange=()=>{draft.course.name=cn.value;const hit=MALAYSIA_COURSES.find(n=>n.toLowerCase()===cn.value.trim().toLowerCase());if(hit){const cached=db.courseCache.find(c=>normalizeCourseName(c.name)===normalizeCourseName(hit));if(cached){draft.course=clone(cached);courseSearchState={status:'selected',results:[],message:`Loaded cached scorecard for ${hit}.`};render();}else if(!applyVerifiedCoursePack(hit,{quiet:true}))refreshScorecardFromWeb({name:hit},true);}};}
  const tn=document.getElementById('teeName');if(tn){const f=()=>{applyTeeToCourse(draft.course,tn.value);draft.course.tee=tn.value;if(tn.tagName==='SELECT')render();};tn.oninput=f;tn.onchange=f;}
  const ca=document.getElementById('customAllowance');if(ca)ca.onchange=()=>{draft.allowance=Number(ca.value)||0;initPairStrokes(draft);render();};
  const uh=document.getElementById('useHistory');if(uh)uh.onchange=()=>{draft.useKakiHistory=uh.checked;initPairStrokes(draft);render();};
  const au=document.getElementById('autoUpdate');if(au)au.onchange=()=>draft.autoUpdateKaki=au.checked;
  const bp=document.getElementById('basePoints');if(bp)bp.onchange=()=>draft.baccarat.basePoints=Math.max(1,Number(bp.value)||1);
  const mb=document.getElementById('multBasis');if(mb)mb.onchange=()=>draft.baccarat.multiplierBasis=mb.value;
}

function action(a,el){
  if(a==='home'){view='home';render();}
  else if(a==='new-game') startNewGame();
  else if(a==='repeat-last') repeatLastSetup();
  else if(a==='continue'){view='round';render();}
  else if(a==='players'){view='players';render();}
  else if(a==='history'){view='history';render();}
  else if(a==='settings'){view='settings';render();}
  else if(a==='account'){view='account';authMessage='';render();}
  else if(a==='auth-login-pane'){authPane='login';authMessage='';render();}
  else if(a==='auth-register-pane'){authPane='register';authMessage='';render();}
  else if(a==='auth-login') loginAccount();
  else if(a==='auth-register') registerAccount();
  else if(a==='auth-forgot') forgotPassword();
  else if(a==='auth-logout') logoutAccount();
  else if(a==='auth-save-profile') saveAccountProfile();
  else if(a==='auth-new-password') updateRecoveredPassword();
  else if(a==='auth-reset-email'){if(authSession?.user?.email){sb.auth.resetPasswordForEmail(authSession.user.email,{redirectTo:authRedirectURL()}).then(({error})=>{authMessage=error?error.message:'Password reset email sent.';render();});}}
  else if(a==='cloud-restore') chooseCloudRestore();
  else if(a==='cloud-local') chooseCloudLocal();
  else if(a==='cloud-sync-now') pushCloudState(true);
  else if(a==='export-data') exportDataFile();
  else if(a==='import-data') document.getElementById('importFile')?.click();
  else if(a==='reset-data') resetData();
  else if(a==='wizard-back'){ if(wizardStep>1){wizardStep--;render();} else {view='home';render();} }
  else if(a==='wizard-next') nextWizard();
  else if(a==='add-draft-player'){ if(draft.playerIds.length>=6)return toast('MVP supports up to 6 golfers.'); const unused=db.players.find(p=>!draft.playerIds.includes(p.id)); if(unused){draft.playerIds.push(unused.id);draft.playerTees=draft.playerTees||{};draft.playerTees[unused.id]=preferredTeeForPlayer(unused);initPairStrokes(draft);render();} else openPlayerEditor(null,true); }
  else if(a==='quick-new-player') openPlayerEditor(null,view==='wizard');
  else if(a==='cancel-player-editor'){playerEditor=null;render();}
  else if(a==='save-player-profile') savePlayerProfile();
  else if(a==='toggle-course-holes'){document.getElementById('courseHoles')?.classList.toggle('hidden');}
  else if(a==='find-course-near-me') findNearbyCourses();
  else if(a==='refresh-web-scorecard') refreshScorecardFromWeb(null,false);
  else if(a==='sync-malaysia-pack') syncMalaysiaCoursePack();
  else if(a==='save-api-key'){const k=document.getElementById('golfApiKey')?.value?.trim()||'';db.settings=db.settings||{};db.settings.golfCourseApiKey=k;saveDB();toast(k?'GolfCourseAPI key saved on this device.':'API key cleared.');}
  else if(a==='install-app') installRoundKaki();
  else if(a==='gps-hole') gpsSuggestHole();
  else if(a==='start-round') validateAndStart();
  else if(a==='lock-hole') lockCurrentHole();
  else if(a==='unlock-hole'){const r=db.activeRound,h=r.holes[r.currentHole-1];h.locked=false;h.lockedAt=null;saveDB();render();}
  else if(a==='next-hole') nextHole();
  else if(a==='round-summary'){document.getElementById('app').innerHTML=roundSummaryOverlay();bind();}
  else if(a==='back-to-round'){view='round';render();}
  else if(a==='save-exit-round') saveExitRound();
  else if(a==='cancel-round') cancelActiveRound();
  else if(a==='finish-round') finishRound();
}

function nextWizard(){
  if(wizardStep===1){ if(!draft.course.name.trim())return toast('Select or enter a course name.'); const pars=draft.course.holes.map(h=>Number(h.par)); if(!pars.every(v=>Number.isFinite(v)&&v>=3&&v<=6))return toast('Load or verify Par for all 18 holes first.'); const sis=draft.course.holes.map(h=>Number(h.si)).sort((a,b)=>a-b); if(!sis.every((v,i)=>v===i+1))return toast('Load or verify the real Stroke Index: SI 1–18 must appear exactly once.'); if(draft.course.provider!=='manual')saveCourseCache(draft.course); }
  if(wizardStep===2){ if(draft.playerIds.length<2)return toast('Add at least 2 golfers.'); initPairStrokes(draft); }
  if(wizardStep===4 && !Object.values(draft.games).some(Boolean)) return toast('Select at least one game.');
  wizardStep=Math.min(5,wizardStep+1); render();
}
function validateAndStart(){
  if(!draft.playerIds.length)return;
  if(draft.games.team){const vals=draft.playerIds.map(id=>draft.teamAssignments[id]);if(!vals.includes('A')||!vals.includes('B'))return toast('Partners needs players on both Team A and Team B.');}
  makeRound();
}
function lockCurrentHole(){
  const r=db.activeRound,h=r.holes[r.currentHole-1];h.locked=true;h.lockedAt=todayISO();
  r.players.forEach(p=>{if(!h.scores[p.id])h.scores[p.id]=roundPlayerHole(r,p.id,r.currentHole).par ?? r.course.holes[r.currentHole-1].par;}); saveDB();render();
}
function setUp(pid,val){const r=db.activeRound,h=r.holes[r.currentHole-1];if(h.locked)return;h.up[pid]=val;saveDB();render();}
function changeScore(pid,d){const r=db.activeRound,h=r.holes[r.currentHole-1];if(!h.locked)return;const par=roundPlayerHole(r,pid,r.currentHole).par ?? r.course.holes[r.currentHole-1].par;const curr=Number(h.scores[pid])||par;h.scores[pid]=clamp(curr+d,1,15);saveDB();render();}
function moveHole(d){const r=db.activeRound;r.currentHole=clamp(r.currentHole+d,1,18);saveDB();render();}
function nextHole(){
  const r=db.activeRound,h=r.holes[r.currentHole-1];
  if(!h.locked)return toast('Lock UP/SINGLE declarations first.');
  if(!allScoresEntered(r,h))return toast('Enter every player’s score.');
  if(r.currentHole===18)finishRound();else{r.currentHole++;saveDB();render();}
}

function addPlayerPrompt(){openPlayerEditor(null,view==='wizard');}
function editPlayer(id){openPlayerEditor(id,false);}

window.roundkaki={reset(){localStorage.removeItem(DB_KEY);db=defaultDB();view='home';render();},exportData(){return clone(db);},cloud:{sync:()=>pushCloudState(true)},engine:{strokesOnHole,pairResult,baccaratLedger,pairMatchStatus,parseDistanceMeters,expandHoleElement,apiTeeOptions,openGolfTeeOptions,fetchOpenGolfCoursePackEntry}};
render();
initSupabaseAuth();
})();

</script>
<script>if("serviceWorker" in navigator && location.protocol.startsWith("http")){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js",{scope:"./"}).catch(()=>{}));}</script>
